server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The interface is three small files. Serving them stale after a rebuild
    # costs far more confusion than revalidating is worth.
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location /api/ {
        # Resolved through Docker's DNS on each request rather than once at
        # startup, so a rebuilt backend with a new address does not leave this
        # container returning 502 until it is restarted too.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Answers stream token by token; buffering would hold them back until
        # the response completed, which defeats the point.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Indexing and long answers must not be cut off mid-flight.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 2048m;
    }
}
